sonar.projectKey=nextjs-boilerplate
sonar.projectName=Next.js Boilerplate
sonar.projectVersion=1.0

# Fontes
sonar.sources=src

# Exclusões (build, assets, tipos gerados, configs)
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/coverage/**,\
  **/public/**,\
  **/*.d.ts

# Testes e cobertura
# Marca os arquivos de teste como testes (não os conta como código de produção)
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/__tests__/**
# Relatório de cobertura gerado por `yarn test:cov`
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Servidor local (token passado em runtime pelo start.sh)
sonar.host.url=http://localhost:9000

# Encoding
sonar.sourceEncoding=UTF-8
